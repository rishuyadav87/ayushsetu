version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - ai-engine
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_AI_URL=http://localhost:8000/api

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - JWT_SECRET=ayush-setu-jwt-secret-change-in-production
      - JWT_EXPIRES_IN=7d
      - DATABASE_URL=file:./dev.db
      - AI_ENGINE_URL=http://ai-engine:8000
    volumes:
      - server-data:/app/prisma

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  server-data:
